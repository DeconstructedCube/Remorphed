plugins {
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'checkstyle'
    apply from: rootProject.file("gradle/mixin-check.gradle")

    checkstyle {
        toolVersion = '10.21.4'
        configFile = rootProject.file("config/checkstyle/checkstyle.xml")
        maxWarnings = 0
    }
    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
        maven { url "https://maven.shedaniel.me/" }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = "UTF-8"
        it.options.compilerArgs << "-Xlint:all"
        it.options.compilerArgs << "-Xlint:-processing"
        it.options.compilerArgs << "-Xlint:-classfile"
        it.options.compilerArgs << "-Xlint:-serial"
        it.options.compilerArgs << "-Xlint:-cast"
        it.options.compilerArgs << "-Xlint:-rawtypes"
        it.options.compilerArgs << "-Xlint:-unchecked"
        it.options.compilerArgs << "-Xlint:-deprecation"
        it.options.compilerArgs << "-Xlint:-this-escape"
        it.options.compilerArgs << "-Werror"
    }
    tasks.named('compileJava').configure {
        finalizedBy 'checkstyleMain'
    }
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}
